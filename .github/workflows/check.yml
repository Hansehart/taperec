name: check

# Runs the pre-commit hooks, the minimum Rust version check and a render off macOS.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pre-commit
        env:
          # CI also runs on main itself; the hook guards local commits.
          SKIP: no-commit-to-branch
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

  msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./msrv.sh

  # Render needs no Mac: a synthetic capture and an edit file render and check out on Linux.
  render:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Build taperec
        run: cargo build --locked
      - name: Render and check
        run: tests/render.sh target/debug/taperec "$RUNNER_TEMP/render"

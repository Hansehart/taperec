name: o3s tutorial draft

# Records the o3s getting-started draft on the newest Intel Mac, which runs Docker Desktop.
on:
  push:
    branches: [tutorial/o3s-draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"

      # Calls the action's script directly; its Apple silicon guard is the only part tied to arm64.
      - name: Record
        env:
          INPUT_TAPES: tutorials/o3s-draft.tape
          INPUT_OUT_DIR: taperec
          INPUT_DOCK: Terminal
          INPUT_FROM_SOURCE: "true"
          GITHUB_ACTION_PATH: ${{ github.workspace }}
        run: RUNNER_ARCH=ARM64 bash --noprofile --norc action/main.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial-draft
          path: taperec/
          if-no-files-found: warn

  # Finds which Dock list format the restarted Dock accepts on Intel, with Apple silicon as control.
  dock-diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26-intel, variant: full-format }
          - { runner: macos-26-intel, variant: full-append }
          - { runner: macos-26-intel, variant: minimal-append }
          - { runner: macos-26-intel, variant: clear-only }
          - { runner: macos-26, variant: minimal-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Dock variant
        shell: bash {0}
        run: |
          mkdir -p out
          minimal='<dict><key>tile-data</key><dict><key>file-data</key><dict><key>_CFURLString</key><string>/System/Applications/Utilities/Terminal.app</string><key>_CFURLStringType</key><integer>0</integer></dict></dict></dict>'
          full='<dict><key>tile-data</key><dict><key>file-data</key><dict><key>_CFURLString</key><string>file:///System/Applications/Utilities/Terminal.app/</string><key>_CFURLStringType</key><integer>15</integer></dict><key>file-label</key><string>Terminal</string></dict><key>tile-type</key><string>file-tile</string></dict>'
          state() {
            echo "### $1"
            pgrep -lx Dock || echo "no Dock process"
            osascript -e 'tell application "System Events" to get name of every UI element of list 1 of process "Dock"' 2>&1
            screencapture -x "out/$1.png"
          }
          defaults read com.apple.dock persistent-apps > out/native-persistent-apps.txt 2>&1
          sw_vers > out/machine.txt; uname -m >> out/machine.txt
          state 0-untouched
          case "$VARIANT" in
            full-format) defaults write com.apple.dock persistent-apps -array; defaults write com.apple.dock persistent-apps -array-add "$full" ;;
            full-append) defaults write com.apple.dock persistent-apps -array-add "$full" ;;
            minimal-append) defaults write com.apple.dock persistent-apps -array-add "$minimal" ;;
            clear-only) defaults write com.apple.dock persistent-apps -array ;;
            minimal-arm) defaults write com.apple.dock persistent-apps -array; defaults write com.apple.dock persistent-apps -array-add "$minimal" ;;
          esac
          defaults read com.apple.dock persistent-apps > out/written-persistent-apps.txt 2>&1
          killall Dock
          sleep 5
          state 1-after-5s
          sleep 25
          state 2-after-30s
          log show --last 2m --style compact --predicate 'process == "Dock"' > out/dock-log.txt 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dock-diag-${{ matrix.variant }}
          path: out/

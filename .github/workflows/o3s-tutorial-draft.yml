name: o3s tutorial draft

# Records the o3s getting-started draft on the newest Intel Mac, which runs Docker Desktop.
on:
  push:
    branches: [tutorial/o3s-draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"

      - uses: $/
        with:
          tapes: tutorials/o3s-draft.tape
          dock: Terminal
          from-source: "true"

      # Keeps Docker Desktop's own view of a start that never got ready.
      - name: Docker Desktop diagnostics
        if: failure()
        run: |
          mkdir -p taperec/docker
          pgrep -lf -i docker > taperec/docker/processes.txt 2>&1 || true
          perl -e 'alarm 30; exec @ARGV' /Applications/Docker.app/Contents/Resources/bin/docker desktop status > taperec/docker/status.txt 2>&1 || true
          cp -R "$HOME/Library/Containers/com.docker.docker/Data/log" taperec/docker/ 2>/dev/null || true
          log show --last 30m --style compact --predicate 'process CONTAINS[c] "docker"' > taperec/docker/unified.log 2>&1 || true
          screencapture -x taperec/docker/screen.png || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial-draft
          path: taperec/
          if-no-files-found: warn

  # Types the draft's long commands through taperec while it records, three runs per runner.
  typing-probe:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel]
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: $/
        with:
          tapes: tutorials/typing-probe.tape
          dock: Terminal
          from-source: "true"
      - name: Compare typed lines
        run: .github/scripts/typed-check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: typing-probe-${{ matrix.runner }}-${{ matrix.replica }}
          path: |
            taperec/
            /tmp/typed.txt

  # Types with keys held for a while versus released at once, under a real recording.
  typer-probe:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        hold: [0, 15]
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      TYPER_HOLD: ${{ matrix.hold }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build the typer
        run: swiftc -O .github/scripts/typer.swift -o "$RUNNER_TEMP/typer"
      - uses: $/
        with:
          tapes: tutorials/typer-probe.tape
          from-source: "true"
      - name: Compare typed lines
        run: .github/scripts/typed-check.sh

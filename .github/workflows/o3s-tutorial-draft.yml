name: o3s tutorial draft

# Records the o3s getting-started draft on the newest Intel Mac, which runs Docker Desktop.
on:
  push:
    branches: [tutorial/o3s-draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"

      # Calls the action's script directly; its Apple silicon guard is the only part tied to arm64.
      - name: Record
        env:
          INPUT_TAPES: tutorials/o3s-draft.tape
          INPUT_OUT_DIR: taperec
          INPUT_DOCK: Terminal
          INPUT_FROM_SOURCE: "true"
          GITHUB_ACTION_PATH: ${{ github.workspace }}
        run: RUNNER_ARCH=ARM64 bash --noprofile --norc action/main.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial-draft
          path: taperec/
          if-no-files-found: warn

  # Launches one app per job on Intel after an IconServices treatment, the service stalled app launches wait on.
  launch-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { probe: terminal-plain, app: /System/Applications/Utilities/Terminal.app, proc: Terminal, mode: plain }
          - { probe: terminal-restart-icons, app: /System/Applications/Utilities/Terminal.app, proc: Terminal, mode: restart-icons }
          - { probe: terminal-clear-icons, app: /System/Applications/Utilities/Terminal.app, proc: Terminal, mode: clear-icons }
          - { probe: terminal-wait-5m, app: /System/Applications/Utilities/Terminal.app, proc: Terminal, mode: wait-5m }
          - { probe: vscode-restart-icons, app: /Applications/Visual Studio Code.app, proc: Code, mode: restart-icons }
    runs-on: macos-26-intel
    timeout-minutes: 25
    env:
      APP: ${{ matrix.app }}
      PROC: ${{ matrix.proc }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install VS Code
        if: startsWith(matrix.probe, 'vscode')
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install --cask visual-studio-code
      - name: Launch probe
        timeout-minutes: 14
        run: .github/scripts/launch-probe.sh "$APP" "$PROC" "$MODE" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: launch-probe-${{ matrix.probe }}
          path: out/

  # Builds the release assets of the Intel support branch the way release.yml does.
  cross-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/action-intel
          persist-credentials: false
      - name: Build and package
        run: |
          source action/main.sh
          for arch in ARM64 X64; do
            target=$(target_triple "$arch")
            asset=$(asset_name 0.0.0 "$target")
            rm -rf dist && mkdir -p dist
            build_from_source "$PWD" "$target" dist
            file dist/taperec dist/taperec-caption
            tar -czf "$asset" -C dist taperec taperec-caption
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-build
          path: taperec-*.tar.gz

name: o3s tutorial draft

# Records the o3s getting-started draft on the newest Intel Mac, which runs Docker Desktop.
on:
  push:
    branches: [tutorial/o3s-draft]

permissions:
  contents: read

jobs:
  record:
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"

      # Calls the action's script directly; its Apple silicon guard is the only part tied to arm64.
      - name: Record
        env:
          INPUT_TAPES: tutorials/o3s-draft.tape
          INPUT_OUT_DIR: taperec
          INPUT_DOCK: Terminal
          INPUT_FROM_SOURCE: "true"
          GITHUB_ACTION_PATH: ${{ github.workspace }}
        run: RUNNER_ARCH=ARM64 bash --noprofile --norc action/main.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial-draft
          path: taperec/
          if-no-files-found: warn

  # Repeats the action's desktop setup one step at a time to find what removes the Dock on Intel.
  dock-diag:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Tools
        run: brew install displayplacer ffmpeg
      - name: Each setup step
        run: |
          mkdir -p out
          state() {
            echo "### $1"
            pgrep -lx Dock || echo "no Dock process"
            osascript -e 'tell application "System Events" to count UI elements of list 1 of process "Dock"' 2>&1
            launchctl print "gui/$(id -u)/com.apple.Dock.agent" 2>&1 | grep -E 'state|pid|last exit' | head -4
            screencapture -x "out/$1.png"
          }
          state 0-untouched
          id=$(displayplacer list | awk '/^Persistent screen id:/ { print $4; exit }')
          displayplacer "id:$id res:1920x1080 scaling:off"; sleep 3
          state 1-displayplacer
          ffmpeg -loglevel error -y -f lavfi -i "gradients=s=1920x1080:c0=0x1e3c72:c1=0x7f53ac" -frames:v 1 "$RUNNER_TEMP/w.png"
          osascript -e "tell application \"System Events\" to tell every desktop to set picture to POSIX file \"$RUNNER_TEMP/w.png\""; sleep 3
          state 2-wallpaper
          defaults write com.apple.dock persistent-apps -array
          defaults write com.apple.dock show-recents -bool false
          defaults write com.apple.dock persistent-apps -array-add '<dict><key>tile-data</key><dict><key>file-data</key><dict><key>_CFURLString</key><string>/System/Applications/Utilities/Terminal.app</string><key>_CFURLStringType</key><integer>0</integer></dict></dict></dict>'
          killall Dock; sleep 3
          state 3-dock-reset-3s
          sleep 30
          state 4-dock-reset-33s
          open -a Dock 2>&1 || true; sleep 10
          state 5-open-dock
        shell: bash {0}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dock-diag
          path: out/

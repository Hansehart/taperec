name: o3s tutorial draft

# Records the o3s getting-started draft on the newest Intel Mac, which runs Docker Desktop.
on:
  push:
    branches: [tutorial/o3s-draft]

permissions:
  contents: read

jobs:
  record:
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"

      # Calls the action's script directly; its Apple silicon guard is the only part tied to arm64.
      - name: Record
        env:
          INPUT_TAPES: tutorials/o3s-draft.tape
          INPUT_OUT_DIR: taperec
          INPUT_DOCK: Terminal
          INPUT_FROM_SOURCE: "true"
          GITHUB_ACTION_PATH: ${{ github.workspace }}
        run: RUNNER_ARCH=ARM64 bash --noprofile --norc action/main.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial-draft
          path: taperec/
          if-no-files-found: warn

  # Separates the Dock restart from the rewritten app list as the cause of the missing Dock on Intel.
  dock-diag:
    strategy:
      fail-fast: false
      matrix:
        variant: [restart-only, rewrite-kickstart, rewrite-only]
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Dock variant
        shell: bash {0}
        run: |
          mkdir -p out
          state() {
            echo "### $1"
            pgrep -lx Dock || echo "no Dock process"
            osascript -e 'tell application "System Events" to count UI elements of list 1 of process "Dock"' 2>&1
            screencapture -x "out/$1.png"
          }
          state 0-untouched
          if [ "$VARIANT" != restart-only ]; then
            defaults write com.apple.dock persistent-apps -array
            defaults write com.apple.dock persistent-apps -array-add '<dict><key>tile-data</key><dict><key>file-data</key><dict><key>_CFURLString</key><string>/System/Applications/Utilities/Terminal.app</string><key>_CFURLStringType</key><integer>0</integer></dict></dict></dict>'
          fi
          case "$VARIANT" in
            restart-only) killall Dock ;;
            rewrite-kickstart) launchctl kickstart -k "gui/$(id -u)/com.apple.Dock.agent" ;;
          esac
          sleep 5
          state 1-after-5s
          sleep 25
          state 2-after-30s
          log show --last 3m --style compact --predicate 'process == "Dock"' > out/dock-log.txt 2>&1
          grep -iE 'error|fail|crash|denied|timeout' out/dock-log.txt | head -40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dock-diag-${{ matrix.variant }}
          path: out/

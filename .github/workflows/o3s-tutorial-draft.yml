name: o3s tutorial draft

# Records the o3s getting-started draft on the newest Intel Mac, which runs Docker Desktop.
on:
  push:
    branches: [tutorial/o3s-draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"

      # Calls the action's script directly; its Apple silicon guard is the only part tied to arm64.
      - name: Record
        env:
          INPUT_TAPES: tutorials/o3s-draft.tape
          INPUT_OUT_DIR: taperec
          INPUT_DOCK: Terminal
          INPUT_FROM_SOURCE: "true"
          GITHUB_ACTION_PATH: ${{ github.workspace }}
        run: RUNNER_ARCH=ARM64 bash --noprofile --norc action/main.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial-draft
          path: taperec/
          if-no-files-found: warn

  # Launches one app per job on Intel to find whether app launching itself stalls there.
  launch-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { probe: terminal, app: /System/Applications/Utilities/Terminal.app, proc: Terminal, mode: open }
          - { probe: textedit, app: /System/Applications/TextEdit.app, proc: TextEdit, mode: open }
          - { probe: calculator, app: /System/Applications/Calculator.app, proc: Calculator, mode: open }
          - { probe: safari, app: /Applications/Safari.app, proc: Safari, mode: open }
          - { probe: terminal-binary, app: /System/Applications/Utilities/Terminal.app, proc: Terminal, mode: binary }
          - { probe: terminal-after-dock, app: /System/Applications/Utilities/Terminal.app, proc: Terminal, mode: after-dock }
          - { probe: vscode, app: /Applications/Visual Studio Code.app, proc: Code, mode: open }
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      APP: ${{ matrix.app }}
      PROC: ${{ matrix.proc }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install VS Code
        if: matrix.probe == 'vscode'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install --cask visual-studio-code
      - name: Launch probe
        timeout-minutes: 8
        run: .github/scripts/launch-probe.sh "$APP" "$PROC" "$MODE" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: launch-probe-${{ matrix.probe }}
          path: out/

name: o3s tutorial draft

# Records the o3s getting-started draft on the newest Intel Mac, which runs Docker Desktop.
on:
  push:
    branches: [tutorial/o3s-draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"

      # Calls the action's script directly; its Apple silicon guard is the only part tied to arm64.
      - name: Record
        env:
          INPUT_TAPES: tutorials/o3s-draft.tape
          INPUT_OUT_DIR: taperec
          INPUT_DOCK: Terminal
          INPUT_FROM_SOURCE: "true"
          GITHUB_ACTION_PATH: ${{ github.workspace }}
        run: RUNNER_ARCH=ARM64 bash --noprofile --norc action/main.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial-draft
          path: taperec/
          if-no-files-found: warn

  # Finds the Dock entry the restarted Intel Dock accepts, or a way around rewriting the list.
  dock-diag:
    strategy:
      fail-fast: false
      matrix:
        variant: [native-subset, ids, bookmark, running-app]
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Dock variant
        shell: bash {0}
        run: |
          mkdir -p out
          app=/System/Applications/Utilities/Terminal.app
          state() {
            echo "### $1"
            pgrep -lx Dock || echo "no Dock process"
            osascript -e 'tell application "System Events" to get name of every UI element of list 1 of process "Dock"' 2>&1
            screencapture -x "out/$1.png"
          }
          state 0-untouched
          case "$VARIANT" in
            native-subset)
              defaults export com.apple.dock - | python3 -c '
          import plistlib, sys
          d = plistlib.loads(sys.stdin.buffer.read())
          d["persistent-apps"] = [e for e in d["persistent-apps"] if e["tile-data"].get("bundle-identifier") == "com.apple.Safari"]
          sys.stdout.buffer.write(plistlib.dumps(d))' | defaults import com.apple.dock -
              ;;
            ids)
              defaults write com.apple.dock persistent-apps -array-add "<dict><key>GUID</key><integer>$RANDOM$RANDOM</integer><key>tile-data</key><dict><key>bundle-identifier</key><string>com.apple.Terminal</string><key>file-data</key><dict><key>_CFURLString</key><string>file://$app/</string><key>_CFURLStringType</key><integer>15</integer></dict><key>file-label</key><string>Terminal</string><key>file-type</key><integer>41</integer></dict><key>tile-type</key><string>file-tile</string></dict>"
              ;;
            bookmark)
              cat > "$RUNNER_TEMP/add.swift" <<'SWIFT'
          import Foundation
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          let book = try url.bookmarkData()
          let tile: [String: Any] = [
              "tile-type": "file-tile",
              "tile-data": [
                  "book": book,
                  "bundle-identifier": "com.apple.Terminal",
                  "file-label": "Terminal",
                  "file-type": 41,
                  "file-data": ["_CFURLString": url.absoluteString, "_CFURLStringType": 15],
              ],
          ]
          let key = "persistent-apps" as CFString, domain = "com.apple.dock" as CFString
          var apps = CFPreferencesCopyAppValue(key, domain) as? [Any] ?? []
          apps.append(tile)
          CFPreferencesSetAppValue(key, apps as CFArray, domain)
          print(CFPreferencesAppSynchronize(domain))
          SWIFT
              swift "$RUNNER_TEMP/add.swift" "$app" 2>&1 | tail -3
              ;;
            running-app)
              open -a Terminal; sleep 5
              osascript -e 'tell application "Terminal" to close every window' 2>&1; sleep 2
              ;;
          esac
          defaults read com.apple.dock persistent-apps > out/written-persistent-apps.txt 2>&1
          [ "$VARIANT" = running-app ] || killall Dock
          sleep 5
          state 1-after-5s
          sleep 25
          state 2-after-30s
          log show --last 2m --style compact --predicate 'process == "Dock"' > out/dock-log.txt 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dock-diag-${{ matrix.variant }}
          path: out/

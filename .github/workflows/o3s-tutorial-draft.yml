name: o3s tutorial draft

# Records the o3s getting-started draft on Intel Macs, which run Docker Desktop: each section on its own, or the whole tape.
on:
  workflow_dispatch:
    inputs:
      run:
        description: What to record
        type: choice
        options: [sections, full, typer, gatekeeper, wallpaper, keyloss, focus, pts]
        default: sections
      sections:
        description: Sections to record, a JSON list
        default: '["1-docker", "2-vscode", "3-cage"]'

permissions:
  contents: read

# A newer run of the same kind replaces an older one, so stale runs never hold the account's few Macs.
concurrency:
  group: o3s-draft-${{ inputs.run }}-${{ inputs.sections }}
  cancel-in-progress: true

jobs:
  # Each section starts from what the earlier ones show, prepared off camera, so it can be tried in minutes.
  section:
    if: inputs.run == 'sections'
    strategy:
      fail-fast: false
      matrix:
        section: ${{ fromJSON(inputs.sections) }}
    runs-on: macos-26-intel
    timeout-minutes: 75
    env:
      SECTION: ${{ matrix.section }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"

      # Only the downloads behind the off-camera setup; what a section shows stays fresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.section != '1-docker'
        with:
          path: |
            ~/o3s-downloads
            ~/Library/Caches/Homebrew/downloads
          key: o3s-setup-downloads-${{ runner.arch }}

      - name: Prepare earlier sections
        timeout-minutes: 20
        run: .github/scripts/o3s-setup.sh "$SECTION"

      # A screenshot every 10 s shows what happened between the tape's steps.
      - name: Screenshots
        run: nohup .github/scripts/screenshots.sh taperec/shots > /dev/null 2>&1 &

      - uses: $/
        with:
          tapes: tutorials/o3s/${{ matrix.section }}.tape
          dock: Terminal
          from-source: "true"

      - name: Diagnostics
        if: always()
        run: .github/scripts/o3s-diagnostics.sh taperec/diagnostics

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-${{ matrix.section }}
          path: taperec/
          if-no-files-found: warn

  record:
    if: inputs.run == 'full'
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Quiet VS Code from its first start: no welcome page, trust prompt or chat panel.
      - name: VS Code settings
        run: |
          mkdir -p "$HOME/Library/Application Support/Code/User"
          cp config/Code/User/settings.json "$HOME/Library/Application Support/Code/User/settings.json"
      - name: Screenshots
        run: nohup .github/scripts/screenshots.sh taperec/shots > /dev/null 2>&1 &
      - uses: $/
        with:
          tapes: tutorials/o3s-draft.tape
          dock: Terminal
          from-source: "true"
      - name: Diagnostics
        if: always()
        run: .github/scripts/o3s-diagnostics.sh taperec/diagnostics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial-draft
          path: taperec/
          if-no-files-found: warn

  # Types the draft's long commands through taperec under each recorder setting, four runs each.
  typing-probe:
    if: inputs.run == 'typer'
    strategy:
      fail-fast: false
      matrix:
        variant: [current, ultrafast]
        replica: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      FFMPEG_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Recorder variant
        run: |
          echo "$GITHUB_WORKSPACE/.github/shim" >> "$GITHUB_PATH"
          nohup .github/scripts/cpu-sampler.sh "$RUNNER_TEMP/cpu.txt" > /dev/null 2>&1 &
      - uses: $/
        with:
          tapes: tutorials/typing-probe.tape
          dock: Terminal
          from-source: "true"
      - name: Compare typed lines
        run: .github/scripts/typed-check.sh
      - name: CPU while recording
        if: always()
        run: |
          grep -v 'ffmpeg 0 ' "$RUNNER_TEMP/cpu.txt" | awk '{ f += $3; w += $5; a += $7; n++ } END { printf "recording: ffmpeg %.0f%%, WindowServer %.0f%%, all %.0f%% of %d%% over %d samples\n", f/n, w/n, a/n, 100 * '"$(sysctl -n hw.ncpu)"', n }'

  # Presses Open on the first-launch prompt in five ways, including taperec's own click.
  gatekeeper-probe:
    if: inputs.run == 'gatekeeper'
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install VS Code
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install --cask visual-studio-code
      - uses: $/
        with:
          tapes: tutorials/gatekeeper-probe.tape
          from-source: "true"
      - name: Results
        if: always()
        run: |
          mkdir -p out
          cp /tmp/gk-* out/ 2>/dev/null || true
          cat out/gk-summary.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gatekeeper-probe
          path: out/

  # Checks that switching off click-to-show-desktop keeps windows in place on a stray desktop click.
  wallpaper-probe:
    if: inputs.run == 'wallpaper'
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Wallpaper probe
        timeout-minutes: 10
        run: .github/scripts/wallpaper-probe.sh out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wallpaper-probe
          path: out/

  # Types about 9,000 characters per job with each way of posting keys while recording, to find what loses keystrokes.
  keyloss-probe:
    if: inputs.run == 'keyloss'
    strategy:
      fail-fast: false
      matrix:
        method: [session, hid, hid-hold]
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      METHOD: ${{ matrix.method }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Keyloss probe
        timeout-minutes: 40
        run: .github/scripts/keyloss-probe.sh "$METHOD" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: keyloss-${{ matrix.method }}-${{ matrix.replica }}
          path: out/

  # Prints what macOS reports about frontmost apps, the facts Focus is built on.
  focus-facts:
    if: inputs.run == 'focus'
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Docker Desktop
        timeout-minutes: 20
        run: .github/scripts/o3s-setup.sh 2-vscode
      - name: Focus facts
        timeout-minutes: 5
        run: .github/scripts/focus-facts.sh

  # Records a static screen with taperec's capture settings and reports its timestamps.
  pts-probe:
    if: inputs.run == 'pts'
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Timestamp probe
        timeout-minutes: 10
        run: .github/scripts/pts-probe.sh out

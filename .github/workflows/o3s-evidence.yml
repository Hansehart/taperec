name: o3s evidence

# Tests an internal cage network with an explicit proxy listener on Docker Desktop for Mac and Linux.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Installs from the command line as docker/docs mac-install.md describes.
      - name: Install Docker Desktop
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: |
          curl -fsSLo "$RUNNER_TEMP/Docker.dmg" https://desktop.docker.com/mac/main/amd64/Docker.dmg
          sudo hdiutil attach "$RUNNER_TEMP/Docker.dmg"
          sudo /Volumes/Docker/Docker.app/Contents/MacOS/install --accept-license --user="$USER"
          sudo hdiutil detach /Volumes/Docker
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: docker desktop start --timeout 360

      # Marks this run's copy of the cage network internal and adds a regular-mode proxy listener (mitmproxy mode_specs).
      - name: Clone and adapt o3s
        run: |
          mkdir -p out
          git clone --depth 1 https://github.com/Hansehart/o3s.git "$HOME/o3s"
          compose="$HOME/o3s/.devcontainer/compose.yaml"
          yq -i '.networks.cage.internal = true' "$compose"
          yq -i '.services.proxy.command += ["--mode", "regular@10.10.0.2:8080"]' "$compose"
          yq '{"networks": .networks, "proxy": .services.proxy.command}' "$compose" | tee out/compose-changes.yaml

      - name: Raise o3s while polling the cage
        timeout-minutes: 30
        run: |
          .github/scripts/o3s-window.sh 1500 > out/window.txt 2>&1 &
          poller=$!
          npx -y @devcontainers/cli@0.89.0 up --workspace-folder "$HOME/o3s" > out/up.json 2> out/up.log || true
          sleep 60
          kill "$poller" 2>/dev/null || true
          grep -E '\[o3s\]' out/up.log | tee out/o3s-check.txt || true

      # The gateway admits cage traffic to its own ports 53 and 8443 only.
      - name: Open the proxy listener to the cage
        run: docker exec o3s-gateway-1 iptables -I INPUT -s 10.10.0.0/24 -p tcp --dport 8080 -j ACCEPT

      - name: Egress tests
        timeout-minutes: 10
        run: .github/scripts/o3s-proxy-test.sh > out/proxy-test.txt 2>&1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.runner }}
          path: out/
          if-no-files-found: warn

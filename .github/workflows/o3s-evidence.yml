name: o3s evidence

# Tests a gateway-less cage bridge and the bridge firewall's role in o3s egress on Docker Desktop for Mac and Linux.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26-intel, variant: inhibit }
          - { runner: ubuntu-24.04, variant: inhibit }
          - { runner: macos-26-intel, variant: brnf-off }
          - { runner: ubuntu-24.04, variant: brnf-on }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Installs from the command line as docker/docs mac-install.md describes.
      - name: Install Docker Desktop
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: |
          curl -fsSLo "$RUNNER_TEMP/Docker.dmg" https://desktop.docker.com/mac/main/amd64/Docker.dmg
          sudo hdiutil attach "$RUNNER_TEMP/Docker.dmg"
          sudo /Volumes/Docker/Docker.app/Contents/MacOS/install --accept-license --user="$USER"
          sudo hdiutil detach /Volumes/Docker
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: docker desktop start --timeout 360

      # inhibit keeps the cage bridge non-internal without an IPv4 address (moby inhibit_ipv4); brnf-* mark it internal.
      - name: Clone and adapt o3s
        run: |
          mkdir -p out
          git clone --depth 1 https://github.com/Hansehart/o3s.git "$HOME/o3s"
          compose="$HOME/o3s/.devcontainer/compose.yaml"
          case "${{ matrix.variant }}" in
            inhibit) yq -i '.networks.cage.driver_opts["com.docker.network.bridge.inhibit_ipv4"] = "true"' "$compose" ;;
            brnf-*) yq -i '.networks.cage.internal = true' "$compose" ;;
          esac
          yq '.networks' "$compose" | tee out/networks.yaml

      # Sets bridge firewalling against each platform's default (linuxkit builds it in, Ubuntu loads it as a module).
      - name: Flip bridge firewalling
        if: startsWith(matrix.variant, 'brnf-')
        run: |
          if [ "${{ matrix.variant }}" = brnf-on ]; then
            sudo modprobe br_netfilter
          else
            docker run --rm --privileged --pid=host alpine:3 nsenter -t 1 -n -- sysctl -w net.bridge.bridge-nf-call-iptables=0
          fi

      - name: Raise o3s while polling the cage
        timeout-minutes: 30
        run: |
          .github/scripts/o3s-window.sh 1500 > out/window.txt 2>&1 &
          poller=$!
          npx -y @devcontainers/cli@0.89.0 up --workspace-folder "$HOME/o3s" > out/up.json 2> out/up.log || true
          sleep 60
          kill "$poller" 2>/dev/null || true
          grep -E '\[o3s\]' out/up.log | tee out/o3s-check.txt || true

      - name: Keep bridge firewalling off
        if: matrix.variant == 'brnf-off'
        run: docker run --rm --privileged --pid=host alpine:3 nsenter -t 1 -n -- sysctl -w net.bridge.bridge-nf-call-iptables=0

      - name: Engine facts
        timeout-minutes: 5
        run: .github/scripts/o3s-engine-facts.sh > out/engine-facts.txt 2>&1

      - name: Egress tests
        timeout-minutes: 10
        run: .github/scripts/o3s-egress-tests.sh > out/egress.txt 2>&1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.runner }}-${{ matrix.variant }}
          path: out/
          if-no-files-found: warn

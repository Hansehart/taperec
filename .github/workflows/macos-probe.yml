name: macOS probe

# Probes Docker Desktop and o3s on the Intel hosted Mac, time-boxing every step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      # Docker Desktop's VM needs the hypervisor (kern.hv_support: 1).
      - name: Machine
        run: |
          mkdir -p out
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; sysctl kern.hv_support; } 2>&1 | tee out/machine.txt

      # Installs from the command line as docker/docs mac-install.md describes.
      - name: Install Docker Desktop
        timeout-minutes: 12
        run: |
          curl -fsSLo "$RUNNER_TEMP/Docker.dmg" https://desktop.docker.com/mac/main/amd64/Docker.dmg
          sudo hdiutil attach "$RUNNER_TEMP/Docker.dmg"
          sudo /Volumes/Docker/Docker.app/Contents/MacOS/install --accept-license --user="$USER" 2>&1 | tee out/install.txt
          sudo hdiutil detach /Volumes/Docker
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      # docker desktop start waits for the engine within --timeout (docker_desktop_start.yaml).
      - name: Start Docker Desktop
        id: docker
        timeout-minutes: 8
        continue-on-error: true
        run: |
          ( for i in $(seq 1 14); do screencapture -x "out/start-$i.png"; sleep 30; done ) &
          shots=$!
          if docker desktop start --timeout 360; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          fi
          kill "$shots" 2>/dev/null || true
          screencapture -x out/start-final.png
          docker desktop status 2>&1 | tee out/status.txt
          docker info > out/docker-info.txt 2>&1 || true

      - name: Docker Desktop logs
        if: always()
        timeout-minutes: 2
        run: docker desktop logs > out/desktop-logs.txt 2>&1 || true

      # Raises o3s the way its own CI does.
      - name: o3s stack
        if: steps.docker.outputs.up == 'true'
        timeout-minutes: 25
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Hansehart/o3s.git "$HOME/o3s"
          npx -y @devcontainers/cli up --workspace-folder "$HOME/o3s" > out/up.json 2> out/up.log \
            || echo "devcontainer up failed" | tee -a out/o3s.txt
          docker ps -a --format '{{.Names}}\t{{.Status}}' | tee out/containers.txt
          {
            echo "allowed:"; docker exec -u ubuntu o3s-cage-1 curl -sSI --max-time 15 https://github.com 2>&1 | head -1
            echo "blocked:"; docker exec -u ubuntu o3s-cage-1 curl -sSI --max-time 15 https://example.com 2>&1 | head -1
          } | tee -a out/o3s.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-probe
          path: out/
          if-no-files-found: error

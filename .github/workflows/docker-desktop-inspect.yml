name: Docker Desktop inspect

# Lists the Go modules and linked libraries inside Docker Desktop for Mac, without installing it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Open the installer
        run: |
          mkdir -p out
          curl -fsSLo "$RUNNER_TEMP/Docker.dmg" https://desktop.docker.com/mac/main/amd64/Docker.dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/Docker.dmg"
          defaults read "$RUNNER_TEMP/dmg/Docker.app/Contents/Info.plist" CFBundleShortVersionString | tee out/version.txt

      # Go keeps package paths in every binary, even stripped, so strings shows which libraries it uses.
      - name: Binaries, modules and libraries
        run: |
          app="$RUNNER_TEMP/dmg/Docker.app"
          touch out/go-modules.txt
          find "$app" -type f -perm -u+x | while read -r f; do
            file -b "$f" | grep -q Mach-O || continue
            rel=${f#"$app"/}
            echo "$rel" >> out/binaries.txt
            if strings -a "$f" | grep -E '^(path|mod|dep)[[:space:]]' > "$RUNNER_TEMP/mods"; then
              { echo "### $rel"; cat "$RUNNER_TEMP/mods"; } >> out/go-modules.txt
            fi
            { echo "### $rel"; otool -L "$f" 2>&1; } >> out/linked-libs.txt
            printf '%s\t%s\n' "$(strings -a "$f" | grep -c 'gvisor.dev/gvisor')" "$rel" >> out/gvisor-paths.txt
          done
          grep -iE 'gvisor|vpnkit|tap-vsock|krun|vfkit|netstack' out/go-modules.txt > out/networking-modules.txt || true
          find "$app" -iname '*licen*' -o -iname '*notice*' -o -iname '*third*party*' | sed "s|$app/||" > out/license-files.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docker-desktop-inspect
          path: out/
          if-no-files-found: warn

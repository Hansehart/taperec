name: commitlint

# Lints the commit messages a pull request adds.
on: pull_request

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: commitlint
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: |
          # The checkout's owner runs git, so git trusts the repository.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
            commitlint/commitlint:21.2.3@sha256:33f225c84111a38ebac0c81fa21c488a79709b8a8e04056dfaaf4f80ef20be25 \
            --verbose --from "$FROM" --to "$TO"

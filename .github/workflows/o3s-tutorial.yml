name: o3s tutorial

# Records the o3s getting-started tutorial from examples/o3s on Intel Macs, which run Docker Desktop.
on:
  # Temporary: registers the workflow and records the parts from the pull request.
  pull_request:
    paths: [examples/o3s/**, .github/workflows/o3s-tutorial.yml]
  workflow_dispatch:
    inputs:
      run:
        description: "parts: each part alone, the earlier ones prepared off camera; full: all parts in one take"
        type: choice
        options: [parts, full]
        default: parts
      parts:
        description: Parts to record alone, a JSON list
        default: '["1-docker", "2-vscode", "3-cage"]'

permissions:
  contents: read

# A newer run of the same kind replaces an older one, so stale runs never hold the account's few Macs.
concurrency:
  group: o3s-tutorial-${{ inputs.run }}-${{ inputs.parts }}
  cancel-in-progress: true

jobs:
  part:
    if: inputs.run == 'parts' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts || '["1-docker", "2-vscode", "3-cage"]') }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Only the downloads behind the off-camera setup; what a part shows stays fresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.part != '1-docker'
        with:
          path: |
            ~/o3s-downloads
            ~/Library/Caches/Homebrew/downloads
          key: o3s-setup-downloads-${{ runner.arch }}
      - name: Prepare earlier parts
        timeout-minutes: 20
        run: examples/o3s/setup.sh "$PART"
      - name: Screenshots
        run: nohup examples/o3s/screenshots.sh taperec/shots > /dev/null 2>&1 &
      - uses: $/
        with:
          tapes: examples/o3s/${{ matrix.part }}.yaml
          dock: Terminal
          from-source: "true"
      - name: Diagnostics
        if: failure()
        run: examples/o3s/diagnostics.sh taperec/diagnostics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-${{ matrix.part }}
          path: taperec/
          if-no-files-found: warn

  full:
    if: inputs.run == 'full'
    runs-on: macos-26-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare the Mac
        run: examples/o3s/setup.sh 1-docker
      - name: Screenshots
        run: nohup examples/o3s/screenshots.sh taperec/shots > /dev/null 2>&1 &
      # Each part picks up where the one before left the desktop.
      - uses: $/
        with:
          tapes: examples/o3s/*.yaml
          dock: Terminal
          from-source: "true"
      # The parts render alike, so their streams join without re-encoding.
      - name: Join the parts
        run: |
          for part in taperec/o3s-[0-9]-*.mp4; do printf "file '%s'\n" "${part#taperec/}"; done > taperec/parts.txt
          ffmpeg -v error -f concat -i taperec/parts.txt -c copy -movflags +faststart taperec/o3s.mp4
          tests/verify-video.sh taperec/o3s.mp4
      - name: Diagnostics
        if: failure()
        run: examples/o3s/diagnostics.sh taperec/diagnostics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o3s-tutorial
          path: taperec/
          if-no-files-found: warn

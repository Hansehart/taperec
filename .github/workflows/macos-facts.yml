name: macOS facts

# Dumps the runner's references (man pages, scripting dictionaries, fonts, tool help) as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facts:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: System
        run: |
          mkdir -p facts
          { sw_vers; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"; uname -a; } > facts/system.txt
          { swift --version; xcode-select -p; rustup --version; rustup show; } > facts/toolchains.txt 2>&1

      - name: Manuals
        run: |
          for page in osascript screencapture defaults sips; do
            man "$page" | col -bx > "facts/man-$page.txt"
          done

      - name: Scripting dictionaries
        run: |
          sdef "/System/Library/CoreServices/System Events.app" > facts/system-events.sdef
          sdef /System/Library/CoreServices/Finder.app > facts/finder.sdef

      - name: Fonts and Dock
        run: |
          ls -1 /System/Library/Fonts /System/Library/Fonts/Supplemental /Library/Fonts > facts/fonts.txt 2>&1
          defaults read com.apple.dock > facts/dock-defaults.txt

      - name: Tools
        run: |
          brew install ffmpeg cliclick displayplacer
          {
            brew list --versions ffmpeg cliclick displayplacer
            ffmpeg -hide_banner -version
          } > facts/tool-versions.txt
          ffmpeg -hide_banner -h demuxer=avfoundation > facts/ffmpeg-avfoundation.txt
          ffmpeg -hide_banner -filters > facts/ffmpeg-filters.txt
          # Lists capture devices on stderr, then exits with an error.
          ffmpeg -hide_banner -f avfoundation -list_devices true -i "" > facts/ffmpeg-devices.txt 2>&1 || true
          cliclick -h > facts/cliclick-help.txt 2>&1 || true
          displayplacer --help > facts/displayplacer-help.txt 2>&1 || true
          displayplacer list > facts/displayplacer-list.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-facts
          path: facts/
          if-no-files-found: error

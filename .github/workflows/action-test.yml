name: action test

# Runs the action from this repository on a hosted Mac.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      from-source:
        description: Build taperec from source instead of downloading the release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The desktop helper against a fixture window, without recording anything.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test the helper's parsing
        run: swift test --package-path tools/desktop
      - name: Build the helper and the fixture
        run: |
          swift build -c release --package-path tools/desktop
          swift build -c release --package-path tools/desktop --show-bin-path >> "$GITHUB_PATH"
          swiftc -O tests/fixtures/Fixture.swift -o "$RUNNER_TEMP/taperec-fixture"
      # The desktop as the action leaves it for tapes.
      - name: Settle the Dock
        run: |
          source action/main.sh
          if crashing_icon_agent "$(target_triple "$RUNNER_ARCH")"; then icon_agent_off; fi
          old=$(pgrep -x Dock)
          killall Dock
          wait_for_dock "$RUNNER_TEMP" "$old"
      - name: Check the desktop contract
        run: tests/desktop-contract.sh "$(command -v taperec-desktop)" "$RUNNER_TEMP/taperec-fixture"
      - name: Screenshot
        if: failure()
        run: screencapture -x "$RUNNER_TEMP/desktop.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: action-test-desktop-${{ matrix.runner }}
          path: ${{ runner.temp }}/desktop.png
          if-no-files-found: ignore

  record:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: render
        uses: $/
        with:
          tapes: tests/smoke.yaml
          dock: Terminal
          from-source: ${{ github.event_name != 'workflow_dispatch' || inputs.from-source }}
      - name: Verify
        env:
          VIDEOS: ${{ steps.render.outputs.videos }}
        run: |
          [ "$VIDEOS" = "taperec/smoke.mp4" ] || { echo "::error::videos output is '$VIDEOS'"; exit 1; }
          tests/verify-video.sh taperec/smoke.mp4
      # The raw capture, timeline and captions rebuild the video without recording again.
      - name: Re-render from the raw material
        run: |
          ls taperec/smoke.raw.mov taperec/smoke.timeline.yaml taperec/smoke.warp0.png
          "$RUNNER_TEMP/taperec-bin/taperec" render taperec/smoke.timeline.yaml --out taperec/rerender.mp4
          tests/verify-video.sh taperec/rerender.mp4
      - name: Record still and changing screens
        run: tests/record-contract.sh "$RUNNER_TEMP/taperec-bin/taperec-desktop" "$RUNNER_TEMP/record"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: action-test-record-${{ matrix.runner }}
          path: taperec/
          if-no-files-found: ignore

  failure:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: render
        uses: $/
        continue-on-error: true
        env:
          TAPEREC_DEBUG: "1"
        with:
          tapes: tests/fail.yaml
          from-source: ${{ github.event_name != 'workflow_dispatch' || inputs.from-source }}
      - name: Verify the failure
        env:
          OUTCOME: ${{ steps.render.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::the failing tape ended with $OUTCOME"; exit 1; }
          [ -s taperec/fail-failshot.png ] || { echo "::error::no failshot"; exit 1; }
      # The aborted capture stays readable, with the time of its first frame.
      - name: Read the partial capture
        run: |
          ls -l taperec/
          perl -e 'open my $f, "<:raw", $ARGV[0] or die; while (read($f, my $h, 8) == 8) {
              my ($n, $t) = unpack "Na4", $h; print "$t $n\n"; last if $n < 8; seek $f, $n - 8, 1 }' taperec/fail.raw.mov
          ffprobe -v error -show_entries format=duration:format_tags=com.taperec.start -of default=nw=1 taperec/fail.raw.mov
          ffmpeg -v error -i taperec/fail.raw.mov -f null -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: action-test-failure-${{ matrix.runner }}
          path: taperec/
          if-no-files-found: ignore

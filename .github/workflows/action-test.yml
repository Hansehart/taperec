name: action test

# Runs the action from this repository on a hosted Mac.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      from-source:
        description: Build taperec from source instead of downloading the release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The desktop helper against a fixture window, without recording anything.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Test the helper's parsing
        run: swift test --package-path tools/desktop
      - name: Build the helper and the fixture
        run: |
          swift build -c release --package-path tools/desktop
          swift build -c release --package-path tools/desktop --show-bin-path >> "$GITHUB_PATH"
          swiftc -O tests/fixtures/Fixture.swift -o "$RUNNER_TEMP/taperec-fixture"
      # The desktop as the action leaves it for tapes.
      - name: Settle the Dock
        run: |
          source action/main.sh
          if crashing_icon_agent "$(target_triple "$RUNNER_ARCH")"; then icon_agent_fix; fi
          old=$(pgrep -x Dock)
          killall Dock
          wait_for_dock "$RUNNER_TEMP" "$old"
      - name: Check the desktop contract
        run: tests/desktop-contract.sh "$(command -v taperec-desktop)" "$RUNNER_TEMP/taperec-fixture"
      - name: Screenshot
        if: failure()
        run: screencapture -x "$RUNNER_TEMP/desktop.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: action-test-desktop-${{ matrix.runner }}
          path: ${{ runner.temp }}/desktop.png
          if-no-files-found: ignore

  record:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: render
        uses: $/
        with:
          tapes: tests/smoke.yaml
          dock: Terminal
          from-source: ${{ github.event_name != 'workflow_dispatch' || inputs.from-source }}
      - name: Verify
        env:
          VIDEOS: ${{ steps.render.outputs.videos }}
        run: |
          [ "$VIDEOS" = "taperec/smoke.mp4" ] || { echo "::error::videos output is '$VIDEOS'"; exit 1; }
          tests/verify-video.sh taperec/smoke.mp4
      # The raw capture, timeline and edit file rebuild the video without recording again.
      - name: Re-render from the raw material
        run: |
          ls taperec/smoke.raw.* taperec/smoke.timeline.yaml
          "$RUNNER_TEMP/taperec-bin/taperec" render taperec/smoke.timeline.yaml --edit tests/smoke.edit.yaml --out taperec/rerender.mp4
          tests/verify-video.sh taperec/rerender.mp4
      # An edit naming a mark the recording lacks fails with the item's path.
      - name: Reject an edit with an unknown mark
        run: |
          printf 'tracks:\n  text:\n    - { text: x, from: nowhere, duration: 1s }\n' > taperec/bad.edit.yaml
          if error=$("$RUNNER_TEMP/taperec-bin/taperec" render taperec/smoke.timeline.yaml --edit taperec/bad.edit.yaml --out taperec/bad.mp4 2>&1); then
            echo "::error::rendering a bad edit succeeded"; exit 1
          fi
          echo "$error"
          grep -qF 'tracks.text[0].from' <<<"$error" || { echo "::error::the error names no item"; exit 1; }
      # The edit's zoom changes frames while it lasts and is gone once it ends.
      - name: Check the zoom
        run: |
          sed '/^  zoom:/,$d' tests/smoke.edit.yaml > taperec/nozoom.edit.yaml
          "$RUNNER_TEMP/taperec-bin/taperec" render taperec/smoke.timeline.yaml --edit taperec/nozoom.edit.yaml --out taperec/nozoom.mp4
          ffmpeg -v error -i taperec/smoke.mp4 -i taperec/nozoom.mp4 \
            -lavfi "[0:v][1:v]blend=all_mode=difference,signalstats,metadata=print:key=lavfi.signalstats.YAVG:file=taperec/zoom-diff.txt" \
            -f null -
          most=$(sed -n 's/.*YAVG=//p' taperec/zoom-diff.txt | sort -n | tail -1)
          last=$(sed -n 's/.*YAVG=//p' taperec/zoom-diff.txt | tail -1)
          echo "zoom difference: at most $most, last frame $last"
          awk -v m="$most" -v l="$last" 'BEGIN { exit !(m > 10 && l < 2) }' || { echo "::error::the zoom is missing or never ends"; exit 1; }
      # The tape's chapter opens on a card over the dimmed screen, then sits in the frosted bar along the top,
      # which goes once the tape ends the chapter.
      - name: Check the card and the bar
        run: |
          luma() {
            ffmpeg -v error "$1" "$2" -i taperec/smoke.mp4 -frames:v 1 \
              -vf "crop=$3,signalstats,metadata=print:key=lavfi.signalstats.YAVG:file=-" -f null - |
              sed -n 's/.*YAVG=//p' | head -n 1
          }
          carded=$(luma -ss 1 300:60:100:900)
          clear=$(luma -ss 5 300:60:100:900)
          echo "lower-left luma: $carded under the card, $clear after it"
          awk -v a="$carded" -v b="$clear" 'BEGIN { exit !(a < b * 0.6) }' || { echo "::error::the chapter card is missing"; exit 1; }
          shown=$(luma -ss 5 1920:64:0:0)
          hidden=$(luma -sseof -0.5 1920:64:0:0)
          echo "top band luma: $shown with the bar, $hidden once the chapter ends"
          awk -v a="$shown" -v b="$hidden" 'BEGIN { exit !(a < b * 0.8) }' || { echo "::error::the bar is missing or never goes"; exit 1; }
      # On Intel, the restarted icon agent drew the recording's icons without crashing (actions/runner-images#14751).
      - name: Check the icon agent
        if: runner.arch == 'X64'
        run: |
          status=$(launchctl print "gui/$(id -u)/com.apple.iconservices.iconservicesagent")
          grep -E 'state|successive crashes|MTL_ERROR_MODE' <<<"$status"
          ! grep -q 'successive crashes' <<<"$status" || { echo "::error::the icon agent crashes"; exit 1; }
      # `auto` picks ScreenCaptureKit with a hardware encoder, ffmpeg without one.
      - name: Show the recorder auto chose
        run: |
          echo "H.264 encoder: $("$RUNNER_TEMP/taperec-bin/taperec-desktop" encoder)"
          ls taperec/smoke.raw.*
      - name: Record still and changing screens
        run: tests/record-contract.sh "$RUNNER_TEMP/taperec-bin/taperec-desktop" "$RUNNER_TEMP/record"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: action-test-record-${{ matrix.runner }}
          path: taperec/
          if-no-files-found: ignore

  failure:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: render
        uses: $/
        continue-on-error: true
        with:
          tapes: tests/fail.yaml
          wallpaper: "#1e1e2e"
          from-source: ${{ github.event_name != 'workflow_dispatch' || inputs.from-source }}
      - name: Verify the failure
        env:
          OUTCOME: ${{ steps.render.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::the failing tape ended with $OUTCOME"; exit 1; }
          [ -s taperec/fail-failshot.png ] || { echo "::error::no failshot"; exit 1; }
      # The chosen wallpaper fills the desktop: one pixel left of centre, below the menu bar.
      - name: Check the wallpaper
        run: |
          read -r r g b < <(ffmpeg -v error -i taperec/fail-failshot.png -vf "crop=1:1:300:600,format=rgb24" -f rawvideo - | od -An -tu1)
          echo "wallpaper pixel: $r $g $b"
          near() { [ $(($1 - $2)) -le 12 ] && [ $(($2 - $1)) -le 12 ]; }
          if ! { near "$r" 30 && near "$g" 30 && near "$b" 46; }; then
            echo "::error::wallpaper pixel $r $g $b is not #1e1e2e"
            exit 1
          fi
      # The aborted capture stays readable, with the time of its first frame.
      - name: Read the partial capture
        run: |
          raw=$(ls taperec/fail.raw.*)
          ffprobe -v error -show_entries format=duration,start_time:format_tags=com.taperec.start -of default=nw=1 "$raw"
          ffmpeg -v error -i "$raw" -f null -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: action-test-failure-${{ matrix.runner }}
          path: taperec/
          if-no-files-found: ignore

name: taperec
description: Record scripted macOS tutorial videos from YAML tapes.
author: Hansehart
branding:
  icon: film
  color: purple

inputs:
  tapes:
    description: Tape files to record, one glob per line.
    required: true
  out-dir:
    description: Directory for the videos and failure screenshots.
    default: taperec
  dock:
    description: Apps the Dock shows, one name per line, e.g. Terminal.
    default: ""
  from-source:
    description: Build taperec from the action's source instead of downloading its release.
    default: "false"
  wallpaper:
    description: "Desktop background: a #rrggbb color or an image path (filled and cropped to 1920x1080); a gradient unless given."
    default: ""
  recorder:
    description: "How to capture the screen: auto (ScreenCaptureKit with a hardware encoder, else ffmpeg), ffmpeg or screencapturekit."
    default: auto

outputs:
  videos:
    description: Paths of the recorded videos, one per line.
    value: ${{ steps.record.outputs.videos }}

runs:
  using: composite
  steps:
    # Keys the caches of taperec's own tooling; what a tape demonstrates is never cached.
    - id: keys
      shell: bash
      run: |
        echo "brew=taperec-brew-$RUNNER_OS-$RUNNER_ARCH-$(date +%G-%V)" >> "$GITHUB_OUTPUT"
        echo "build=taperec-build-$RUNNER_OS-$RUNNER_ARCH-$(cat "$GITHUB_ACTION_PATH"/{Cargo.lock,rust-toolchain.toml} "$GITHUB_ACTION_PATH"/tools/desktop/{Package.swift,Sources/*/*.swift} | shasum -a 256 | cut -c 1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/Homebrew/downloads
        key: ${{ steps.keys.outputs.brew }}
        restore-keys: taperec-brew-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.from-source == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.rustup/toolchains
          ~/.cargo/registry
          ~/.cargo/git
          ${{ github.action_path }}/target
          ${{ github.action_path }}/tools/desktop/.build
        key: ${{ steps.keys.outputs.build }}
        restore-keys: taperec-build-${{ runner.os }}-${{ runner.arch }}-
    - id: record
      shell: bash
      env:
        INPUT_TAPES: ${{ inputs.tapes }}
        INPUT_OUT_DIR: ${{ inputs.out-dir }}
        INPUT_DOCK: ${{ inputs.dock }}
        INPUT_FROM_SOURCE: ${{ inputs.from-source }}
        INPUT_RECORDER: ${{ inputs.recorder }}
        INPUT_WALLPAPER: ${{ inputs.wallpaper }}
      run: bash --noprofile --norc "$GITHUB_ACTION_PATH/action/main.sh"

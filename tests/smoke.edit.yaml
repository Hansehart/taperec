# yaml-language-server: $schema=../schema/taperec-edit.schema.json
# Places a comment, a speed-up and a zoom onto the Terminal window against the smoke tape's marks.
tracks:
  comment:
    - { text: Typing a command, from: prompt, until: waiting }
  speed:
    - { label: Waiting, length: 1s, from: waiting, until: waited }
  zoom:
    - { window: prompt, from: prompt, until: waited }

# yaml-language-server: $schema=../schema/taperec.schema.json
# Plays Dock clicks, focus, windows, typing, pasting, keys and waits on a hosted Mac; the edit file zooms and
# speeds up against its marks.
output: smoke.mp4
edit: smoke.edit.yaml
steps:
  - set: { moveDuration: 600ms, typingSpeed: 40ms }
  - text: taperec smoke test
  - sleep: 1s
  - click: { dock: Terminal }
  - waitWindow: { title: sh, timeout: 30s }
  - focus: Terminal
  - sleep: 1s
  # Fails the tape when a lone Return goes missing.
  - paste: touch /tmp/taperec-return
  - key: return
  - waitUntil: { command: test -f /tmp/taperec-return, timeout: 10s }
  # Fails the tape when pasted text goes missing.
  - paste: echo the quick brown fox jumps over 0123456789 lazy dogs > /tmp/taperec-typed
  - key: return
  - waitUntil:
      command: grep -qx 'the quick brown fox jumps over 0123456789 lazy dogs' /tmp/taperec-typed
      timeout: 10s
  - mark: { name: prompt, at: { point: { x: 480, y: 200 } } }
  - type: echo taperec smoke
  - key: return
  - mark: waiting
  - waitUntil: { command: sleep 3, timeout: 30s }
  - mark: waited
  - key: primary+k
  - text: ""
  - type: echo done
  - key: return
  # Outlasts the Return's keycaps, so the video ends without overlays.
  - sleep: 3s

# yaml-language-server: $schema=../../schema/taperec.schema.json
# Part 3: reopen o3s in its cage and show which hosts answer, with Docker, VS Code and o3s ready.
output: o3s-3-cage.mp4
# Texts, speed-ups and zooms live in the edit file, placed against these marks.
edit: 3-cage.edit.yaml
steps:
  - set: { moveDuration: 700ms }
  - sleep: 1s
  # Dev Containers gives up on the cage when Docker does not answer at once.
  - waitUntil: { command: /Applications/Docker.app/Contents/Resources/bin/docker info, timeout: 5m }
  # Off camera: the tutorial's cage skips o3s's optional features (AI agents, Docker inside) to build fast;
  # git ignores the edit, so the clone still looks untouched.
  - waitUntil:
      command: >-
        python3 examples/o3s/no-features.py "$HOME/o3s/.devcontainer/devcontainer.json" &&
        git -C "$HOME/o3s" update-index --skip-worktree .devcontainer/devcontainer.json
  - waitUntil:
      command: "'/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code' $HOME/o3s"
      timeout: 1m
  - waitWindow: { title: o3s, timeout: 2m }
  - focus: Visual Studio Code
  - sleep: 3s
  - key: primary+shift+p
  - sleep: 800ms
  - paste: "Dev Containers: Reopen in Container"
  - sleep: 800ms
  - key: return
  - mark: reopen
  # VS Code takes keys once Dev Containers is done: its lifecycle markers are written and the extension
  # host runs inside the cage.
  - waitUntil:
      command: >-
        /Applications/Docker.app/Contents/Resources/bin/docker exec
        "$(/Applications/Docker.app/Contents/Resources/bin/docker ps -q --filter label=com.docker.compose.service=cage)"
        sh -c 'ls /home/*/.devcontainer/.postStartCommandMarker &&
        pgrep -f -- --type=extensionHost' > /dev/null
      # Dev Containers logs this line when a Docker command for the cage fails.
      failWhen: >-
        grep -qs 'Command failed: docker'
        "$HOME/Library/Application Support/Code/logs"/*/window*/exthost/ms-vscode-remote.remote-containers/remoteContainers-*.log
      timeout: 60m
  - mark: cage-built
  - sleep: 2s
  # A new terminal, whatever the panel shows; toggling would only hide the setup log.
  - key: ctrl+shift+`
  # The terminal is ready once its shell runs inside the cage.
  - waitUntil:
      command: >-
        /Applications/Docker.app/Contents/Resources/bin/docker exec
        "$(/Applications/Docker.app/Contents/Resources/bin/docker ps -q --filter label=com.docker.compose.service=cage)"
        pgrep -f -- '--init-file .*shellIntegration'
      timeout: 2m
  - sleep: 1s
  # The answers are the point of the tutorial; the edit file closes in on the terminal here.
  - mark: curl
  - paste: curl -sI https://github.com | head -1
  - key: return
  - sleep: 2s
  - paste: curl -sSI --max-time 5 https://example.com
  - key: return
  - sleep: 2s
  - mark: answered
  - sleep: 3s

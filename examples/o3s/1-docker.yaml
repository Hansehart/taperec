# yaml-language-server: $schema=../../schema/taperec.schema.json
# Part 1: Docker Desktop from the command line, through its first-run window.
output: o3s-1-docker.mp4
steps:
  - set: { moveDuration: 700ms }
  - bar: "1/3 · Install Docker Desktop"
  - sleep: 1s
  # Every click is zoomed in on, then out once its result shows.
  - zoom: { dock: Terminal }
  - click: { dock: Terminal }
  - waitWindow: { title: sh, timeout: 30s }
  - sleep: 500ms
  - zoom: off
  - sleep: 1s
  - paste: curl -fsSLo /tmp/Docker.dmg https://desktop.docker.com/mac/main/amd64/Docker.dmg
  - key: return
  - warp:
      label: Downloading Docker Desktop
      length: 2s
      steps:
        - waitUntil: { command: test -s /tmp/Docker.dmg && ! pgrep -x curl, timeout: 4m }
  - paste: >-
      sudo hdiutil attach /tmp/Docker.dmg &&
      sudo /Volumes/Docker/Docker.app/Contents/MacOS/install --accept-license --user=$USER &&
      sudo hdiutil detach /Volumes/Docker
  - key: return
  - warp:
      label: Installing Docker Desktop
      length: 2s
      steps:
        - waitUntil:
            # The volume goes before `hdiutil` exits; typing earlier would go to it, not the shell.
            command: >-
              test -x /Applications/Docker.app/Contents/Resources/bin/docker && ! test -d /Volumes/Docker &&
              ! pgrep -x hdiutil
            timeout: 4m
  # The CLI's start can wrongly report a running Docker Desktop right after installing, so open the app.
  - paste: open /Applications/Docker.app
  - key: return
  - warp:
      label: Starting Docker
      length: 2s
      steps:
        - waitUntil: { command: /Applications/Docker.app/Contents/Resources/bin/docker info, timeout: 5m }
  - sleep: 1.5s
  # Hide its welcome window and carry on in Terminal.
  - focus: Docker Desktop
  - key: primary+h
  - focus: Terminal
  - sleep: 1s
  - key: primary+k
  - paste: "/Applications/Docker.app/Contents/Resources/bin/docker info --format '{{.ServerVersion}}'"
  - key: return
  - sleep: 3s

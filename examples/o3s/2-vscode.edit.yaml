# yaml-language-server: $schema=../../schema/taperec-edit.schema.json
# Part 2's texts, speed-ups and zooms, against the marks in 2-vscode.yaml.
tracks:
  text:
    - { text: "2/3 · Install VS Code and Dev Containers, clone o3s", from: start, until: end }
    - { text: macOS asks once before opening an app from the internet, from: open-button, until: o3s-open }
  speed:
    - { label: Installing VS Code, length: 2s, from: vscode-installing, until: vscode-installed }
    - { label: Installing Dev Containers, length: 2s, from: extension-installing, until: extension-installed }
    # Cloning o3s and macOS verifying VS Code before it asks.
    - { label: Verifying VS Code, length: 2s, from: extension-installed + 3s, until: open-button - 1s }
  zoom:
    # Every click is zoomed in on, then out once its result shows.
    - { at: terminal-icon, from: terminal-icon, until: terminal-open }
    # The Gatekeeper dialog, framed whole.
    - { window: open-button, from: open-button, until: opened }
